<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Red Rush - Car Racing Game</title>

    <!-- <link rel="stylesheet" href="style.css"> -->
     <style>
        /* =====================================================
   RED RUSH - CAR RACING GAME
   COMPLETE CSS
===================================================== */


/* ================= RESET ================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


html,
body {
    width: 100%;
    min-height: 100%;
}


body {
    background:
        radial-gradient(
            circle at top,
            #241014,
            #08090d 55%,
            #030405
        );

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;
}


/* ================= HEADER ================= */

.game-header {
    width: 100%;
    height: 80px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 35px;

    background: rgba(5, 5, 8, 0.95);

    border-bottom: 1px solid rgba(255, 255, 255, 0.08);

    position: relative;
    z-index: 10;
}


.logo {
    font-size: 27px;
    font-weight: 900;

    letter-spacing: 3px;

    color: white;
}


.logo span {
    color: #ff1e32;
}


.stats {
    display: flex;

    gap: 12px;
}


.stat-box {
    min-width: 85px;

    padding: 7px 12px;

    text-align: center;

    background: rgba(255, 255, 255, 0.05);

    border:
        1px solid
        rgba(255, 255, 255, 0.08);

    border-radius: 10px;
}


.stat-box small {
    display: block;

    color: #888;

    font-size: 9px;

    letter-spacing: 1px;
}


.stat-box strong {
    display: block;

    margin-top: 2px;

    color: #ff3348;

    font-size: 17px;
}


/* ================= GAME WRAPPER ================= */

.game-wrapper {
    width: 100%;

    min-height:
        calc(100vh - 80px);

    display: flex;

    align-items: center;

    flex-direction: column;

    padding-top: 20px;
}


/* ================= GAME ================= */

#game {
    position: relative;

    width: 430px;

    height: 650px;

    max-height:
        calc(100vh - 180px);

    overflow: hidden;

    border-radius: 20px;

    border:
        2px solid
        rgba(255, 40, 60, 0.25);

    box-shadow:
        0 0 40px
        rgba(255, 0, 40, 0.18);

    background: #121318;
}


/* ================= ROAD ================= */

.road {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    background:

        linear-gradient(
            90deg,
            #17181c 0%,
            #28292d 4%,
            #292a2e 96%,
            #17181c 100%
        );

    overflow: hidden;
}


/* Road edge */

.road::before,
.road::after {
    content: "";

    position: absolute;

    top: 0;

    width: 5px;

    height: 100%;

    background:
        linear-gradient(
            to bottom,
            #ff2338,
            #6e101b,
            #ff2338
        );

    box-shadow:
        0 0 12px
        rgba(255, 30, 50, 0.6);
}


.road::before {
    left: 24px;
}


.road::after {
    right: 24px;
}


/* ================= ROAD LINES ================= */

.road-line {
    position: absolute;

    top: -150px;

    width: 5px;

    height: 130px;

    background:
        rgba(255, 255, 255, 0.65);

    border-radius: 10px;

    animation:
        roadMove
        0.9s
        linear
        infinite;
}


.line1 {
    left: 33.33%;
}


.line2 {
    left: 50%;
}


.line3 {
    left: 66.66%;
}


@keyframes roadMove {

    from {
        transform: translateY(-160px);
    }

    to {
        transform: translateY(820px);
    }

}


/* ================= ROAD GLOW ================= */

.road::after {
    z-index: 1;
}


/* ================= SIDE LIGHTS ================= */

.side-light {
    position: absolute;

    width: 3px;

    height: 100px;

    background: #ff2338;

    box-shadow:
        0 0 12px
        #ff2338;

    animation:
        lightMove
        1.2s
        linear
        infinite;

    z-index: 2;
}


.left-light {
    left: 10px;
}


.right-light {
    right: 10px;
}


@keyframes lightMove {

    from {
        top: -120px;
    }

    to {
        top: 700px;
    }

}


/* ================= PLAYER ================= */

.player-car {

    position: absolute;

    width: 90px;

    height: 145px;

    object-fit: contain;

    left: 50%;

    bottom: 35px;

    transform:
        translateX(-50%);

    z-index: 5;

    user-select: none;

    pointer-events: none;

    filter:
        drop-shadow(
            0 12px 10px
            rgba(0, 0, 0, 0.8)
        );

    transition:
        left 0.08s
        ease-out;
}


/* ================= ENEMY CARS ================= */

.enemy {

    position: absolute;

    width: 76px;

    height: 125px;

    object-fit: contain;

    z-index: 4;

    pointer-events: none;

    filter:
        drop-shadow(
            0 10px 8px
            rgba(0, 0, 0, 0.7)
        );
}


/* ================= SCREEN ================= */

.screen {

    position: absolute;

    inset: 0;

    z-index: 20;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        rgba(0, 0, 0, 0.72);

    backdrop-filter:
        blur(5px);
}


.hidden {
    display: none !important;
}


/* ================= SCREEN CARD ================= */

.screen-card {

    width: 85%;

    padding: 35px 25px;

    text-align: center;

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            rgba(30, 30, 36, 0.97),
            rgba(12, 12, 16, 0.98)
        );

    border:
        1px solid
        rgba(255, 40, 60, 0.35);

    box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.7);
}


.car-icon {
    font-size: 48px;

    margin-bottom: 8px;
}


.screen-card h1 {

    font-size: 38px;

    letter-spacing: 3px;

    margin-bottom: 12px;
}


.screen-card h1 span {
    color: #ff263d;
}


.screen-card p {

    color: #aaa;

    line-height: 1.6;

    font-size: 14px;

    margin-bottom: 25px;
}


/* ================= BUTTON ================= */

.screen-card button {

    border: none;

    outline: none;

    cursor: pointer;

    padding:
        14px 32px;

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            #ff1730,
            #c60019
        );

    color: white;

    font-size: 14px;

    font-weight: bold;

    letter-spacing: 1px;

    box-shadow:
        0 8px 25px
        rgba(255, 0, 40, 0.35);

    transition:
        0.2s;
}


.screen-card button:hover {

    transform:
        translateY(-2px)
        scale(1.03);

    box-shadow:
        0 12px 30px
        rgba(255, 0, 40, 0.5);
}


.screen-card button:active {

    transform:
        scale(0.96);
}


/* ================= CONTROL INFO ================= */

.controls-info {

    margin-top: 25px;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 12px;

    color: #777;

    font-size: 12px;
}


.controls-info span:first-child,
.controls-info span:last-child {

    font-size: 18px;

    color: #ff3448;
}


/* ================= GAME OVER ================= */

.game-over-card h1 {

    color: #ff263d;

    font-size: 30px;
}


.danger {

    font-size: 48px;

    margin-bottom: 10px;
}


.game-over-card strong {

    display: block;

    font-size: 45px;

    color: white;

    margin:
        5px 0 12px;
}


.new-best {

    color: #ffbd2e !important;

    font-weight: bold;

    margin-bottom: 20px !important;
}


/* ================= MOBILE CONTROLS ================= */

.mobile-controls {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 25px;

    margin-top: 15px;
}


.control-btn {

    width: 75px;

    height: 55px;

    border-radius: 15px;

    border:
        1px solid
        rgba(255, 50, 70, 0.4);

    background:
        rgba(255, 255, 255, 0.07);

    color: white;

    font-size: 25px;

    cursor: pointer;

    touch-action: manipulation;

    user-select: none;

    -webkit-tap-highlight-color:
        transparent;

    transition: 0.15s;
}


.control-btn:active {

    background: #ff2038;

    transform:
        scale(0.9);
}


.control-btn.brake {

    font-size: 15px;

    color: #ff3448;
}


/* ================= INSTRUCTIONS ================= */

.instructions {

    margin-top: 12px;

    display: flex;

    gap: 25px;

    color: #666;

    font-size: 11px;
}


.instructions b {
    color: #999;
}


/* =====================================================
   TABLET
===================================================== */

@media (max-width: 700px) {

    .game-header {

        height: 65px;

        padding:
            0 15px;
    }


    .logo {

        font-size: 21px;
    }


    .stats {

        gap: 5px;
    }


    .stat-box {

        min-width: 55px;

        padding: 5px;
    }


    .stat-box small {

        font-size: 7px;
    }


    .stat-box strong {

        font-size: 13px;
    }


    .game-wrapper {

        padding-top: 10px;
    }


    #game {

        width:
            min(430px, 94vw);

        height:
            min(
                650px,
                calc(100vh - 155px)
            );

        border-radius: 15px;
    }


    .mobile-controls {

        margin-top: 8px;

        gap: 18px;
    }


    .control-btn {

        width: 68px;

        height: 48px;
    }


    .instructions {

        display: none;
    }

}


/* =====================================================
   SMALL PHONE
===================================================== */

@media (max-width: 430px) {

    .game-header {

        padding:
            0 10px;
    }


    .logo {

        font-size: 17px;

        letter-spacing: 2px;
    }


    .stat-box {

        min-width: 48px;
    }


    .stat-box strong {

        font-size: 12px;
    }


    #game {

        width: 96vw;

        height:
            calc(100vh - 145px);

        min-height: 420px;
    }


    .player-car {

        width: 70px;

        height: 115px;
    }


    .enemy {

        width: 62px;

        height: 105px;
    }


    .screen-card {

        width: 88%;

        padding:
            25px 18px;
    }


    .screen-card h1 {

        font-size: 28px;
    }


    .car-icon {

        font-size: 38px;
    }


    .mobile-controls {

        gap: 12px;
    }


    .control-btn {

        width: 65px;

        height: 45px;

        border-radius: 12px;
    }

}


/* =====================================================
   VERY SMALL PHONE
===================================================== */

@media (max-width: 350px) {

    .logo {

        font-size: 14px;
    }


    .stat-box {

        min-width: 42px;

        padding: 4px;
    }


    .stat-box small {

        font-size: 6px;
    }


    .stat-box strong {

        font-size: 11px;
    }


    .control-btn {

        width: 58px;

        height: 42px;
    }

}
     </style>
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="game-header">

        <div class="logo">
            RED<span>RUSH</span>
        </div>

        <div class="stats">

            <div class="stat-box">
                <small>SCORE</small>
                <strong id="score">0</strong>
            </div>

            <div class="stat-box">
                <small>BEST</small>
                <strong id="best">0</strong>
            </div>

            <div class="stat-box">
                <small>SPEED</small>
                <strong id="speed">1x</strong>
            </div>

        </div>

    </header>


    <!-- ================= GAME AREA ================= -->

    <main class="game-wrapper">

        <div id="game">

            <!-- Road -->

            <div class="road">

                <div class="road-line line1"></div>
                <div class="road-line line2"></div>
                <div class="road-line line3"></div>

            </div>


            <!-- Side lights -->

            <div class="side-light left-light"></div>
            <div class="side-light right-light"></div>


            <!-- Player Car -->

            <img
                src="images/red-car.png"
                id="player"
                class="player-car"
                alt="Red Racing Car"
            >


            <!-- Start Screen -->

            <div id="startScreen" class="screen">

                <div class="screen-card">

                    <div class="car-icon">🏎️</div>

                    <h1>RED<span>RUSH</span></h1>

                    <p>
                        Dodge the traffic.<br>
                        Survive as long as you can.
                    </p>

                    <button id="startBtn">
                        START RACE
                    </button>

                    <div class="controls-info">

                        <span>⬅️</span>
                        <span>Arrow Keys</span>
                        <span>➡️</span>

                    </div>

                </div>

            </div>


            <!-- Game Over Screen -->

            <div id="gameOverScreen" class="screen hidden">

                <div class="screen-card game-over-card">

                    <div class="danger">💥</div>

                    <h1>GAME OVER</h1>

                    <p>Your Score</p>

                    <strong id="finalScore">
                        0
                    </strong>

                    <p id="newBest" class="new-best">
                        NEW BEST!
                    </p>

                    <button id="restartBtn">
                        RACE AGAIN
                    </button>

                </div>

            </div>

        </div>


        <!-- ================= MOBILE CONTROLS ================= -->

        <div class="mobile-controls">

            <button
                id="leftBtn"
                class="control-btn"
            >
                ◀
            </button>

            <button
                id="brakeBtn"
                class="control-btn brake"
            >
                ●
            </button>

            <button
                id="rightBtn"
                class="control-btn"
            >
                ▶
            </button>

        </div>


        <!-- Instructions -->

        <div class="instructions">

            <div>
                <b>PC:</b>
                Use ← → Arrow Keys
            </div>

            <div>
                <b>PHONE:</b>
                Use Touch Buttons
            </div>

        </div>

    </main>

</body>
<script>
    /* =========================================================
   RED RUSH - UNIQUE CAR RACING GAME
   COMPLETE JAVASCRIPT
========================================================= */


/* =========================================================
   GET HTML ELEMENTS
========================================================= */

const game = document.getElementById("game");

const player = document.getElementById("player");

const scoreElement =
    document.getElementById("score");

const bestElement =
    document.getElementById("best");

const speedElement =
    document.getElementById("speed");

const startScreen =
    document.getElementById("startScreen");

const gameOverScreen =
    document.getElementById("gameOverScreen");

const startBtn =
    document.getElementById("startBtn");

const restartBtn =
    document.getElementById("restartBtn");

const finalScore =
    document.getElementById("finalScore");

const newBest =
    document.getElementById("newBest");

const leftBtn =
    document.getElementById("leftBtn");

const rightBtn =
    document.getElementById("rightBtn");

const brakeBtn =
    document.getElementById("brakeBtn");


/* =========================================================
   GAME VARIABLES
========================================================= */

let gameRunning = false;

let score = 0;

let bestScore =
    Number(localStorage.getItem("redRushBest")) || 0;


/*
   Base enemy speed
*/
let baseSpeed = 3.5;


/*
   Current game speed
*/
let gameSpeed = 1;


/*
   Difficulty level

   Level 1 = 0-99
   Level 2 = 100-199
   Level 3 = 200-299
   etc.
*/
let difficultyLevel = 1;


/*
   Enemy creation timer
*/
let enemyTimer = 0;


/*
   Player position
*/
let playerX = 50;


/*
   Keyboard controls
*/
let keys = {
    left: false,
    right: false
};


/*
   Enemy array
*/
let enemies = [];


/*
   Animation frame
*/
let animationId;


/*
   Score timer
*/
let scoreTimer;


/* =========================================================
   INITIAL BEST SCORE
========================================================= */

bestElement.textContent = bestScore;


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    /*
       Stop old game
    */
    cancelAnimationFrame(animationId);

    clearInterval(scoreTimer);


    /*
       Reset values
    */

    gameRunning = true;

    score = 0;

    baseSpeed = 3.5;

    gameSpeed = 1;

    difficultyLevel = 1;

    enemyTimer = 0;

    playerX = 50;


    /*
       Reset controls
    */

    keys.left = false;
    keys.right = false;


    /*
       Reset UI
    */

    scoreElement.textContent = "0";

    speedElement.textContent = "1.0x";


    /*
       Hide screens
    */

    startScreen.classList.add("hidden");

    gameOverScreen.classList.add("hidden");


    /*
       Remove old enemies
    */

    removeEnemies();


    /*
       Put player at center
    */

    setPlayerPosition();


    /*
       Reset road speed
    */

    resetRoadSpeed();


    /*
       Start score
    */

    scoreTimer = setInterval(
        increaseScore,
        100
    );


    /*
       Start game loop
    */

    gameLoop();
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop() {

    if (!gameRunning) {
        return;
    }


    /*
       Move player
    */

    movePlayer();


    /*
       Create enemy cars
    */

    createEnemies();


    /*
       Move enemy cars
    */

    moveEnemies();


    /*
       Update game difficulty
    */

    updateDifficulty();


    /*
       Check collision
    */

    checkCollisions();


    /*
       Continue animation
    */

    animationId =
        requestAnimationFrame(gameLoop);
}


/* =========================================================
   SCORE
========================================================= */

function increaseScore() {

    if (!gameRunning) {
        return;
    }


    /*
       Score increases automatically
    */

    score += 1;


    scoreElement.textContent =
        Math.floor(score);
}


/* =========================================================
   DIFFICULTY SYSTEM
========================================================= */

function updateDifficulty() {

    /*
       Every 100 points:
       difficulty increases
    */

    difficultyLevel =
        Math.floor(score / 100) + 1;


    /*
       Automatic race speed

       Level 1 = 1.0x
       Level 2 = 1.15x
       Level 3 = 1.30x
       Level 4 = 1.45x
       etc.
    */

    gameSpeed =
        1 +
        ((difficultyLevel - 1) * 0.15);


    /*
       Maximum speed

       Prevents game from becoming
       impossible.
    */

    if (gameSpeed > 3.5) {

        gameSpeed = 3.5;
    }


    /*
       Show speed
    */

    speedElement.textContent =
        gameSpeed.toFixed(1) + "x";


    /*
       Increase road speed
    */

    updateRoadSpeed();
}


/* =========================================================
   ROAD SPEED
========================================================= */

function updateRoadSpeed() {

    /*
       Starting road speed
    */

    let roadDuration =
        0.9 -
        ((difficultyLevel - 1) * 0.07);


    /*
       Minimum duration

       Lower duration = faster road
    */

    if (roadDuration < 0.28) {

        roadDuration = 0.28;
    }


    /*
       Road lines
    */

    const roadLines =
        document.querySelectorAll(
            ".road-line"
        );


    roadLines.forEach(
        function(line) {

            line.style.animationDuration =
                roadDuration + "s";

        }
    );


    /*
       Side lights
    */

    const sideLights =
        document.querySelectorAll(
            ".side-light"
        );


    let lightDuration =
        1.2 -
        ((difficultyLevel - 1) * 0.08);


    if (lightDuration < 0.35) {

        lightDuration = 0.35;
    }


    sideLights.forEach(
        function(light) {

            light.style.animationDuration =
                lightDuration + "s";

        }
    );
}


/* =========================================================
   RESET ROAD SPEED
========================================================= */

function resetRoadSpeed() {

    const roadLines =
        document.querySelectorAll(
            ".road-line"
        );


    roadLines.forEach(
        function(line) {

            line.style.animationDuration =
                "0.9s";

        }
    );


    const sideLights =
        document.querySelectorAll(
            ".side-light"
        );


    sideLights.forEach(
        function(light) {

            light.style.animationDuration =
                "1.2s";

        }
    );
}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function movePlayer() {

    /*
       Movement speed

       As race becomes faster,
       player movement becomes slightly faster.
    */

    const moveAmount =
        0.75 * gameSpeed;


    /*
       Move left
    */

    if (keys.left) {

        playerX -= moveAmount;
    }


    /*
       Move right
    */

    if (keys.right) {

        playerX += moveAmount;
    }


    /*
       Road boundary
    */

    const minX = 12;

    const maxX = 88;


    /*
       Stop player outside road
    */

    if (playerX < minX) {

        playerX = minX;
    }


    if (playerX > maxX) {

        playerX = maxX;
    }


    /*
       Update position
    */

    setPlayerPosition();
}


/* =========================================================
   PLAYER POSITION
========================================================= */

function setPlayerPosition() {

    player.style.left =
        playerX + "%";
}


/* =========================================================
   KEYBOARD CONTROL
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        /*
           Left arrow
        */

        if (
            event.key === "ArrowLeft"
        ) {

            keys.left = true;

            event.preventDefault();
        }


        /*
           Right arrow
        */

        if (
            event.key === "ArrowRight"
        ) {

            keys.right = true;

            event.preventDefault();
        }


        /*
           Space = start/restart
        */

        if (
            event.key === " " &&
            !gameRunning
        ) {

            startGame();
        }

    }
);


/* =========================================================
   KEYBOARD RELEASE
========================================================= */

document.addEventListener(
    "keyup",
    function(event) {

        if (
            event.key === "ArrowLeft"
        ) {

            keys.left = false;
        }


        if (
            event.key === "ArrowRight"
        ) {

            keys.right = false;
        }

    }
);


/* =========================================================
   MOBILE LEFT BUTTON
========================================================= */

function startLeft(event) {

    event.preventDefault();

    keys.left = true;
}


function stopLeft(event) {

    event.preventDefault();

    keys.left = false;
}


leftBtn.addEventListener(
    "touchstart",
    startLeft,
    { passive: false }
);


leftBtn.addEventListener(
    "touchend",
    stopLeft,
    { passive: false }
);


leftBtn.addEventListener(
    "touchcancel",
    stopLeft,
    { passive: false }

/* =========================================================
   CREATE ENEMIES
========================================================= */

function createEnemies() {

    enemyTimer++;


    /*
       Enemy spawn rate

       Starting:
       enemies come slowly.

       Higher level:
       enemies come faster.
    */

    let spawnRate =
        75 -
        (difficultyLevel * 6);


    /*
       Minimum spawn gap
    */

    if (spawnRate < 22) {

        spawnRate = 22;
    }


    /*
       Create enemy
    */

    if (
        enemyTimer >= spawnRate
    ) {

        enemyTimer = 0;

        createEnemy();
    }
}


/* =========================================================
   CREATE ONE ENEMY
========================================================= */

function createEnemy() {

    const enemy =
        document.createElement("img");


    enemy.className =
        "enemy";


    /*
       Different traffic colors
    */

    const colors = [
        "red",
        "blue",
        "yellow",
        "white",
        "black"
    ];


    const randomColor =
        colors[
            Math.floor(
                Math.random() *
                colors.length
            )
        ];


    /*
       Generate enemy SVG
    */

    const svg =
        createEnemySVG(
            randomColor
        );


    enemy.src =
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg);


    /*
       Four lanes
    */

    const lanes = [
        18,
        35,
        52,
        69
    ];


    /*
       Random lane
    */

    const lane =
        lanes[
            Math.floor(
                Math.random() *
                lanes.length
            )
        ];


    /*
       Position
    */

    enemy.style.left =
        lane + "%";


    enemy.style.top =
        "-150px";


    /*
       Add to game
    */

    game.appendChild(enemy);


    /*
       Enemy speed

       Higher difficulty =
       higher enemy speed.
    */

    const enemySpeed =
        baseSpeed *
        gameSpeed *
        (
            0.85 +
            Math.random() * 0.35
        );


    /*
       Save enemy
    */

    enemies.push({

        element: enemy,

        x: lane,

        y: -150,

        speed: enemySpeed

    });
}

/* =========================================================
   MOVE ENEMIES
========================================================= */

function moveEnemies() {

    for (
        let i = enemies.length - 1;
        i >= 0;
        i--
    ) {

        const enemy =
            enemies[i];


        /*
           Move enemy down

           Game speed automatically
           increases this movement.
        */

        enemy.y +=
            enemy.speed;


        /*
           Update screen position
        */

        enemy.element.style.top =
            enemy.y + "px";


        /*
           Enemy passed player
        */

        if (
            enemy.y >
            game.offsetHeight + 160
        ) {

            /*
               Remove enemy
            */

            enemy.element.remove();


            enemies.splice(
                i,
                1
            );

        }

    }
}


/* =========================================================
   COLLISION DETECTION
========================================================= */

function checkCollisions() {

    /*
       Player rectangle
    */

    const playerRect =
        player.getBoundingClientRect();


    /*
       Check every enemy
    */

    for (
        const enemy of enemies
    ) {

        const enemyRect =
            enemy.element
                .getBoundingClientRect();


        /*
           Collision area slightly reduced
           so game feels fair.
        */

        const collision =

            playerRect.left <
            enemyRect.right - 12 &&

            playerRect.right >
            enemyRect.left + 12 &&

            playerRect.top <
            enemyRect.bottom - 15 &&

            playerRect.bottom >
            enemyRect.top + 15;


        /*
           Collision happened
        */

        if (collision) {

            endGame();

            return;
        }

    }
}


/* =========================================================
   GAME OVER
========================================================= */

function endGame() {

    /*
       Stop game
    */

    gameRunning = false;


    /*
       Stop animation
    */

    cancelAnimationFrame(
        animationId
    );


    /*
       Stop score
    */

    clearInterval(
        scoreTimer
    );


    /*
       Reset controls
    */

    keys.left = false;

    keys.right = false;


    /*
       Final score
    */

    const currentScore =
        Math.floor(score);


    finalScore.textContent =
        currentScore;


    /*
       Check new best
    */

    if (
        currentScore >
        bestScore
    ) {

        bestScore =
            currentScore;


        /*
           Save in browser
        */

        localStorage.setItem(
            "redRushBest",
            bestScore
        );


        /*
           Update best
        */

        bestElement.textContent =
            bestScore;


        /*
           Show new best
        */

        newBest.classList.remove(
            "hidden"
        );

    } else {

        newBest.classList.add(
            "hidden"
        );
    }


    /*
       Show Game Over screen
    */

    gameOverScreen.classList.remove(
        "hidden"
    );
}


/* =========================================================
   REMOVE ALL ENEMIES
========================================================= */

function removeEnemies() {

    enemies.forEach(
        function(enemy) {

            enemy.element.remove();

        }
    );


    enemies = [];
}
