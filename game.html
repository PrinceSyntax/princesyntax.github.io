<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Highway Racer</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    font-family:Arial,sans-serif;
    overflow:hidden;
    color:white;
}


/* GAME AREA */

.game{
    position:relative;

    width:400px;
    height:100vh;

    max-height:800px;

    margin:auto;

    overflow:hidden;

    background:#222;

    border-left:8px solid #111;
    border-right:8px solid #111;

    box-shadow:
        0 0 40px rgba(0,0,0,.8);
}


/* ROAD */

.road{
    position:absolute;

    width:100%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #159447 0%,
            #159447 12%,
            #333 12%,
            #333 88%,
            #159447 88%,
            #159447 100%
        );
}


/* ROAD LINES */

.line{
    position:absolute;

    width:8px;
    height:80px;

    background:white;

    left:33.33%;

    animation:roadMove .7s linear infinite;
}

.line2{
    left:66.66%;
}

@keyframes roadMove{

    from{
        transform:translateY(-100px);
    }

    to{
        transform:translateY(100vh);
    }

}


/* SCORE */

.hud{
    position:absolute;

    top:15px;
    left:15px;
    right:15px;

    display:flex;

    justify-content:space-between;

    z-index:20;
}

.score,
.speed{
    padding:10px 15px;

    border-radius:10px;

    background:rgba(0,0,0,.65);

    font-weight:bold;

    border:1px solid rgba(255,255,255,.2);
}


/* PLAYER CAR */

.car{
    position:absolute;

    width:55px;
    height:95px;

    bottom:30px;

    left:calc(50% - 27px);

    background:
        linear-gradient(
            90deg,
            #111,
            #e50909,
            #ff3030,
            #111
        );

    border-radius:14px 14px 9px 9px;

    z-index:10;

    box-shadow:
        0 8px 15px rgba(0,0,0,.6);

    transition:left .08s linear;
}


/* CAR WINDOW */

.car::before{
    content:"";

    position:absolute;

    width:35px;
    height:30px;

    left:10px;
    top:13px;

    background:
        linear-gradient(
            135deg,
            #b9f3ff,
            #174d67
        );

    border-radius:7px;
}


/* CAR LIGHTS */

.car::after{
    content:"";

    position:absolute;

    width:9px;
    height:8px;

    left:8px;
    bottom:8px;

    background:#fff;

    border-radius:50%;

    box-shadow:
        30px 0 #fff;
}


/* WHEELS */

.wheel{
    position:absolute;

    width:8px;
    height:23px;

    background:#080808;

    border-radius:5px;

    top:25px;
}

.w1{
    left:-5px;
}

.w2{
    right:-5px;
}

.w3{
    left:-5px;
    bottom:15px;
    top:auto;
}

.w4{
    right:-5px;
    bottom:15px;
    top:auto;
}


/* ENEMY CAR */

.enemy{
    position:absolute;

    width:55px;
    height:95px;

    border-radius:14px 14px 9px 9px;

    z-index:8;

    box-shadow:
        0 8px 15px rgba(0,0,0,.6);
}


/* ENEMY WINDOW */

.enemy::before{
    content:"";

    position:absolute;

    width:35px;
    height:30px;

    left:10px;
    top:13px;

    background:
        linear-gradient(
            135deg,
            #b9f3ff,
            #174d67
        );

    border-radius:7px;
}


/* START SCREEN */

.start-screen{
    position:absolute;

    inset:0;

    background:
        linear-gradient(
            rgba(0,0,0,.8),
            rgba(0,0,0,.9)
        );

    z-index:50;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;
}

.start-screen h1{
    font-size:42px;

    color:#ff3030;

    text-shadow:
        0 0 20px #ff0000;

    margin-bottom:10px;
}

.start-screen p{
    color:#ddd;

    margin-bottom:25px;
}

button{
    border:none;

    padding:14px 30px;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #ff1616,
            #8b0000
        );

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 8px 20px rgba(255,0,0,.3);

    transition:.3s;
}

button:hover{
    transform:scale(1.06);
}


/* GAME OVER */

.game-over{
    position:absolute;

    inset:0;

    z-index:40;

    display:none;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    background:rgba(0,0,0,.82);
}

.game-over h2{
    color:#ff3030;

    font-size:40px;

    margin-bottom:15px;
}

.final-score{
    font-size:20px;

    margin-bottom:25px;
}


/* MOBILE */

@media(max-width:450px){

    .game{
        width:100vw;
    }

}

</style>
</head>


<body>


<div class="game" id="game">


    <!-- ROAD -->

    <div class="road">

        <div class="line"></div>
        <div class="line line2"></div>

        <div
            class="line"
            style="left:50%;animation-delay:.35s">
        </div>

    </div>


    <!-- HUD -->

    <div class="hud">

        <div class="score">
            🏆 Score:
            <span id="score">0</span>
        </div>

        <div class="speed">
            🚀 Speed:
            <span id="speed">1</span>
        </div>

    </div>


    <!-- PLAYER -->

    <div class="car" id="player">

        <span class="wheel w1"></span>
        <span class="wheel w2"></span>
        <span class="wheel w3"></span>
        <span class="wheel w4"></span>

    </div>


    <!-- START -->

    <div class="start-screen" id="startScreen">

        <h1>
            🏎️ HIGHWAY RACER
        </h1>

        <p>
            Dodge the cars and survive!
        </p>

        <p>
            ← → &nbsp; or &nbsp; A D
        </p>

        <button onclick="startGame()">
            START GAME
        </button>

    </div>


    <!-- GAME OVER -->

    <div class="game-over" id="gameOver">

        <h2>
            GAME OVER 💥
        </h2>

        <div class="final-score">

            Your Score:
            <b id="finalScore">0</b>

        </div>

        <button onclick="restartGame()">
            🔄 PLAY AGAIN
        </button>

    </div>


</div>



<script>

/* =========================
   VARIABLES
========================= */

const game =
    document.getElementById("game");

const player =
    document.getElementById("player");

const scoreText =
    document.getElementById("score");

const speedText =
    document.getElementById("speed");

const startScreen =
    document.getElementById("startScreen");

const gameOver =
    document.getElementById("gameOver");

const finalScore =
    document.getElementById("finalScore");


let playerX = 172;

let score = 0;

let speed = 5;

let gameRunning = false;

let enemies = [];

let gameLoop;


/* =========================
   START
========================= */

function startGame(){

    startScreen.style.display = "none";

    gameRunning = true;

    score = 0;

    speed = 5;

    playerX = 172;

    player.style.left =
        playerX + "px";

    scoreText.innerText = score;

    speedText.innerText = 1;

    createEnemy();

    gameLoop =
        requestAnimationFrame(update);

}


/* =========================
   RESTART
========================= */

function restartGame(){

    enemies.forEach(enemy => {

        enemy.element.remove();

    });

    enemies = [];

    gameOver.style.display = "none";

    startGame();

}


/* =========================
   PLAYER MOVEMENT
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(!gameRunning)
            return;


        if(
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ){

            playerX -= 25;

        }


        if(
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ){

            playerX += 25;

        }


        /* ROAD LIMIT */

        if(playerX < 55)
            playerX = 55;

        if(playerX > 290)
            playerX = 290;


        player.style.left =
            playerX + "px";

    }
);


/* =========================
   CREATE ENEMY
========================= */

function createEnemy(){

    if(!gameRunning)
        return;


    const enemy =
        document.createElement("div");

    enemy.classList.add("enemy");


    /* RANDOM COLOR */

    const colors = [
        "#1565c0",
        "#f5b400",
        "#8e44ad",
        "#00a86b",
        "#e67e22"
    ];

    const color =
        colors[
            Math.floor(
                Math.random() *
                colors.length
            )
        ];


    enemy.style.background =
        `linear-gradient(
            90deg,
            #111,
            ${color},
            ${color},
            #111
        )`;


    /* RANDOM LANE */

    const lanes = [
        65,
        172,
        280
    ];

    const lane =
        lanes[
            Math.floor(
                Math.random() *
                lanes.length
            )
        ];


    enemy.style.left =
        lane + "px";

    enemy.style.top =
        "-120px";


    game.appendChild(enemy);


    enemies.push({

        element:enemy,

        x:lane,

        y:-120

    });


    setTimeout(
        createEnemy,
        Math.max(
            600,
            1200 - score * 4
        )
    );

}


/* =========================
   GAME UPDATE
========================= */

function update(){

    if(!gameRunning)
        return;


    enemies.forEach(
        (enemy,index)=>{

            enemy.y += speed;

            enemy.element.style.top =
                enemy.y + "px";


            /* COLLISION */

            if(
                enemy.y + 95 > 0 &&
                enemy.y < 95 &&
                enemy.x < playerX + 55 &&
                enemy.x + 55 > playerX &&
                enemy.y > 0
            ){

                endGame();

            }


            /* PASSED */

            if(enemy.y > game.clientHeight){

                enemy.element.remove();

                enemies.splice(index,1);

                score++;

                scoreText.innerText =
                    score;


                /* SPEED INCREASE */

                if(
                    score % 5 === 0
                ){

                    speed += 0.7;

                    speedText.innerText =
                        Math.floor(
                            speed / 5
                        ) + 1;

                }

            }

        }
    );


    gameLoop =
        requestAnimationFrame(update);

}


/* =========================
   GAME OVER
========================= */

function endGame(){

    gameRunning = false;

    cancelAnimationFrame(gameLoop);

    finalScore.innerText =
        score;

    gameOver.style.display =
        "flex";

}


/* =========================
   TOUCH CONTROL
========================= */

let touchStartX = 0;


game.addEventListener(
    "touchstart",
    function(e){

        touchStartX =
            e.touches[0].clientX;

    }
);


game.addEventListener(
    "touchend",
    function(e){

        let touchEndX =
            e.changedTouches[0].clientX;


        if(
            touchEndX < touchStartX - 30
        ){

            playerX -= 35;

        }


        if(
            touchEndX > touchStartX + 30
        ){

            playerX += 35;

        }


        if(playerX < 55)
            playerX = 55;

        if(playerX > 290)
            playerX = 290;


        player.style.left =
            playerX + "px";

    }
);

</script>

</body>
</html>
